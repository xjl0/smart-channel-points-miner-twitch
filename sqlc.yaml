version: "2"
sql:
  - engine: sqlite
    schema: internal/store/migrations
    queries: internal/store/queries.sql
    gen:
      go:
        package: db
        out: internal/store/db
        emit_json_tags: false
        emit_empty_slices: true
        # Обычные Go-указатели для nullable-колонок вместо обёрток sql.Null*.
        overrides:
          - db_type: DATETIME
            nullable: true
            go_type: { import: time, type: Time, pointer: true }
          - db_type: TEXT
            nullable: true
            go_type: { type: string, pointer: true }
